# cargo-deny configuration for Summoner DAW
# See https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    "ISC",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

# epaint bundles fonts (Ubuntu Font Licence, OFL); permit only for that crate.
[[licenses.exceptions]]
crate = "epaint"
allow = ["LicenseRef-UFL-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[advisories]
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
