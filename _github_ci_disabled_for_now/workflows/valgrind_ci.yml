name: Valgrind Memory Leak CI (Step 1085)

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind gperftools
      - name: Build tests
        run: cargo test --no-run
      - name: Run Valgrind memory leak check
        run: bash scripts/valgrind_check.sh
