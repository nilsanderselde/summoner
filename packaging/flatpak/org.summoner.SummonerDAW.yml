app-id: org.summoner.SummonerDAW
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: summon
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
modules:
  - name: summoner
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/summon /app/bin/summon
    sources:
      - type: dir
        path: ../..
