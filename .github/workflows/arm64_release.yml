name: ARM64 Linux Cross-Compilation Pipeline (Step 1086)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Cross compile for aarch64-unknown-linux-gnu (RPi 5 & Jetson)
        run: cross build --target aarch64-unknown-linux-gnu --release
      - name: Package ARM64 Binaries
        run: tar -czvf summoner-daw-v1.1.0-aarch64-linux.tar.gz -C target/aarch64-unknown-linux-gnu/release summon
