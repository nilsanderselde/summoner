name: Summoner Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: summoner-linux-x86_64.tar.gz
            asset_path: target/x86_64-unknown-linux-gnu/release/summon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: summoner-windows-x86_64.zip
            asset_path: target/x86_64-pc-windows-msvc/release/summon.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: summoner-macos-arm64.tar.gz
            asset_path: target/aarch64-apple-darwin/release/summon

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libasound2-dev libudev-dev pkg-config

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build GUI Release Binary
        run: cargo build --release --target ${{ matrix.target }} --features gui

      - name: Package Artifact (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          tar -czf ${{ matrix.artifact_name }} -C $(dirname ${{ matrix.asset_path }}) $(basename ${{ matrix.asset_path }})

      - name: Package Artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path ${{ matrix.asset_path }} -DestinationPath ${{ matrix.artifact_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
